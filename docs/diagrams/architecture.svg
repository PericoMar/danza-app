<text x="86" y="332" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">Google Play · EAS build</text>
<rect x="68" y="360" width="228" height="56" rx="8" fill="#FAFAFB" stroke="#e2e2e4" stroke-width="1"/>
<rect x="68" y="361" width="4" height="54" rx="2" fill="#000000"/>
<text x="86" y="384" font-size="12.5" fill="#000000" font-weight="700" text-anchor="start" letter-spacing="0">Web</text>
<text x="86" y="402" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">danza-app.com · Vercel</text>
<text x="68" y="432" font-size="10" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">react-native-web + metro · static export</text>
<rect x="390" y="176" width="540" height="620" rx="10" fill="#ffffff" stroke="#e2e2e4" stroke-width="1" filter="url(#soft)"/>
<text x="410" y="206" font-size="10.5" fill="#666666" font-weight="700" text-anchor="start" letter-spacing="2.0">THE APP · EXPO SDK 52 · TYPESCRIPT STRICT</text>
<rect x="450" y="222" width="452" height="56" rx="8" fill="#ffffff" stroke="#e2e2e4" stroke-width="1"/>
<rect x="450" y="223" width="4" height="54" rx="2" fill="#7755FF"/>
<text x="468" y="246" font-size="12.5" fill="#000000" font-weight="700" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">app/</text>
<text x="468" y="264" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">expo-router file routes · typed routes · public-route guard</text>
<rect x="450" y="294" width="452" height="56" rx="8" fill="#FAFAFB" stroke="#e2e2e4" stroke-width="1"/>
<text x="468" y="318" font-size="12.5" fill="#000000" font-weight="700" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">components/</text>
<text x="468" y="336" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">UI only — common, ui, auditions, companies, insights</text>
<rect x="450" y="366" width="452" height="56" rx="8" fill="#FAFAFB" stroke="#e2e2e4" stroke-width="1"/>
<text x="468" y="390" font-size="12.5" fill="#000000" font-weight="700" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">hooks/</text>
<text x="468" y="408" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">TanStack React Query · cache keys · form state</text>
<rect x="450" y="438" width="452" height="56" rx="8" fill="#ffffff" stroke="#e2e2e4" stroke-width="1"/>
<rect x="450" y="439" width="4" height="54" rx="2" fill="#7755FF"/>
<text x="468" y="462" font-size="12.5" fill="#000000" font-weight="700" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">services/</text>
<text x="468" y="480" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">the only layer allowed to call Supabase or fetch()</text>
<rect x="450" y="510" width="452" height="56" rx="8" fill="#FAFAFB" stroke="#e2e2e4" stroke-width="1"/>
<text x="468" y="534" font-size="12.5" fill="#000000" font-weight="700" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">constants/  types/  utils/</text>
<text x="468" y="552" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">table &amp; route names, enums, display logic</text>
<polyline points="426,232 426,550" fill="none" stroke="#7755FF" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowp)"/>
<text x="414" y="470" font-size="9" fill="#7755FF" font-weight="800" letter-spacing="1.5" text-anchor="middle" transform="rotate(-90 414 470)">DEPENDENCIES POINT DOWN</text>
<rect x="410" y="612" width="500" height="78" rx="8" fill="#f3f1fe" stroke="#e3dcfd" stroke-width="1"/>
<text x="428" y="638" font-size="9.5" fill="#7755FF" font-weight="800" text-anchor="start" letter-spacing="1.6">PROVIDER STACK</text>
<text x="428" y="662" font-size="11" fill="#000000" font-weight="600" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">AuthProvider → QueryClient → RoleProvider → PaperProvider</text>
<text x="428" y="680" font-size="10" fill="#666666" font-weight="500" text-anchor="start" letter-spacing="0">the whole tree remounts on session change — no cache survives a login</text>
<rect x="410" y="702" width="500" height="78" rx="8" fill="#FAFAFB" stroke="#e2e2e4" stroke-width="1"/>
<text x="428" y="728" font-size="9.5" fill="#666666" font-weight="800" text-anchor="start" letter-spacing="1.6">PLATFORM SUFFIXES</text>
<text x="428" y="752" font-size="11" fill="#000000" font-weight="600" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">supabase.web.ts · supabase.native.ts · imagePicker</text>
<text x="428" y="770" font-size="10" fill="#666666" font-weight="500" text-anchor="start" letter-spacing="0">moduleSuffixes resolves [".web", ".native", ""] — one import, two builds</text>
<rect x="1060" y="176" width="492" height="352" rx="10" fill="#ffffff" stroke="#e2e2e4" stroke-width="1" filter="url(#soft)"/>
<text x="1080" y="206" font-size="10.5" fill="#666666" font-weight="700" text-anchor="start" letter-spacing="2.0">SUPABASE · POSTGRESQL 15</text>
<rect x="1080" y="220" width="452" height="56" rx="8" fill="#ffffff" stroke="#e2e2e4" stroke-width="1"/>
<text x="1098" y="244" font-size="12.5" fill="#000000" font-weight="700" text-anchor="start" letter-spacing="0">Postgres + RLS</text>
<text x="1098" y="262" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">tables, enums, CHECKs, views, RPC — the domain lives here</text>
<rect x="1080" y="290" width="452" height="56" rx="8" fill="#ffffff" stroke="#e2e2e4" stroke-width="1"/>
<text x="1098" y="314" font-size="12.5" fill="#000000" font-weight="700" text-anchor="start" letter-spacing="0">Auth</text>
<text x="1098" y="332" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">email/password · JWT · is_admin() drives every write policy</text>
<rect x="1080" y="360" width="452" height="56" rx="8" fill="#ffffff" stroke="#e2e2e4" stroke-width="1"/>
<text x="1098" y="384" font-size="12.5" fill="#000000" font-weight="700" text-anchor="start" letter-spacing="0">Storage</text>
<text x="1098" y="402" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">company logos, avatars, ad images</text>
<rect x="1080" y="430" width="452" height="56" rx="8" fill="#ffffff" stroke="#e2e2e4" stroke-width="1"/>
<text x="1098" y="454" font-size="12.5" fill="#000000" font-weight="700" text-anchor="start" letter-spacing="0">Realtime</text>
<text x="1098" y="472" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">admin role changes pushed to the open session</text>
<rect x="1060" y="576" width="492" height="258" rx="10" fill="#ffffff" stroke="#e2e2e4" stroke-width="1" filter="url(#soft)"/>
<text x="1080" y="606" font-size="10.5" fill="#666666" font-weight="700" text-anchor="start" letter-spacing="2.0">VERCEL · NODE FUNCTIONS</text>
<rect x="1080" y="620" width="452" height="50" rx="8" fill="#ffffff" stroke="#e2e2e4" stroke-width="1"/>
<text x="1098" y="644" font-size="12.5" fill="#000000" font-weight="700" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">/api/summary</text>
<text x="1098" y="662" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">AI review summary, streamed over SSE · server-side quota</text>
<rect x="1080" y="682" width="452" height="50" rx="8" fill="#ffffff" stroke="#e2e2e4" stroke-width="1"/>
<text x="1098" y="706" font-size="12.5" fill="#000000" font-weight="700" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">/api/newsletter</text>
<text x="1098" y="724" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">subscribe · status · unsubscribe</text>
<rect x="1080" y="744" width="452" height="50" rx="8" fill="#ffffff" stroke="#e2e2e4" stroke-width="1"/>
<text x="1098" y="768" font-size="12.5" fill="#000000" font-weight="700" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">/api/account/delete</text>
<text x="1098" y="786" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">service-role account deletion</text>
<text x="1080" y="820" font-size="10" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">every function verifies the caller's Supabase JWT before doing anything</text>
<rect x="1220" y="876" width="332" height="66" rx="10" fill="#111111" stroke="#111111" stroke-width="1"/>
<text x="1244" y="904" font-size="14" fill="#ffffff" font-weight="800" text-anchor="start" letter-spacing="0">OpenAI</text>
<text x="1244" y="924" font-size="10" fill="#b9bbc2" font-weight="500" text-anchor="start" letter-spacing="0">server-only key · never shipped to a client</text>
