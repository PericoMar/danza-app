<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.07"/>
  </filter>
  <linearGradient id="chrome" x1="0.12" y1="0" x2="0.88" y2="1">
    <stop offset="0%" stop-color="#fdfdfe"/><stop offset="30%" stop-color="#eceef1"/>
    <stop offset="58%" stop-color="#d8dbe1"/><stop offset="80%" stop-color="#eef0f3"/>
    <stop offset="100%" stop-color="#dcdfe5"/>
  </linearGradient>
  <linearGradient id="dark" x1="0.12" y1="0" x2="0.88" y2="1">
    <stop offset="0%" stop-color="#3a3d44"/><stop offset="55%" stop-color="#17191d"/>
    <stop offset="100%" stop-color="#2c2f35"/>
  </linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
  </marker>
  <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7755FF"/>
  </marker>
</defs>
<rect width="1600" height="1000" fill="#ffffff"/>
<text x="48" y="56" font-size="10.5" fill="#666666" font-weight="700" text-anchor="start" letter-spacing="2.0">DANZA APP · SYSTEM ARCHITECTURE</text>
<text x="48" y="94" font-size="30" fill="#000000" font-weight="800" text-anchor="start" letter-spacing="-0.9">ONE CODEBASE, THREE TARGETS</text>
<text x="48" y="122" font-size="13" fill="#474747" font-weight="400" text-anchor="start" letter-spacing="0">An Expo app compiled to iOS, Android and a static web bundle, a Postgres database that enforces its own rules, and a thin serverless edge for the things a client must not do.</text>
<rect x="48" y="176" width="268" height="282" rx="10" fill="#ffffff" stroke="#e2e2e4" stroke-width="1" filter="url(#soft)"/>
<text x="68" y="206" font-size="10.5" fill="#666666" font-weight="700" text-anchor="start" letter-spacing="2.0">CLIENTS</text>
<rect x="68" y="220" width="228" height="56" rx="8" fill="#FAFAFB" stroke="#e2e2e4" stroke-width="1"/>
<rect x="68" y="221" width="4" height="54" rx="2" fill="#000000"/>
<text x="86" y="244" font-size="12.5" fill="#000000" font-weight="700" text-anchor="start" letter-spacing="0">iOS</text>
<text x="86" y="262" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">App Store · EAS build</text>
<rect x="68" y="290" width="228" height="56" rx="8" fill="#FAFAFB" stroke="#e2e2e4" stroke-width="1"/>
<rect x="68" y="291" width="4" height="54" rx="2" fill="#000000"/>
