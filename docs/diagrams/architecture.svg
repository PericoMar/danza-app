<text x="995.0" y="342" font-size="9.5" fill="#929294" font-weight="800" text-anchor="middle" letter-spacing="1.1">PostgREST + JWT</text>
<polyline points="930,668 995.0,668 995.0,668 1060,668" fill="none" stroke="#666666" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="973.325" y="632.5" width="43.35" height="17.5" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
<text x="995.0" y="644" font-size="9.5" fill="#333333" font-weight="800" text-anchor="middle" letter-spacing="1.1">https</text>
<rect x="951.38" y="646.5" width="87.24000000000001" height="17.5" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
<text x="995.0" y="658" font-size="9.5" fill="#929294" font-weight="800" text-anchor="middle" letter-spacing="1.1">bearer token</text>
<polyline points="1386,834 1386,876" fill="none" stroke="#666666" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="48,944 1552,944" fill="none" stroke="#ececee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="48" y="972" font-size="11" fill="#666666" font-weight="500" text-anchor="start" letter-spacing="0">No server of our own: the database enforces the rules, the functions only do what a client must not.</text>
<text x="1552" y="972" font-size="11" fill="#929294" font-weight="500" text-anchor="end" letter-spacing="0">Deployed from main · Vercel (web) · EAS (iOS / Android)</text>
