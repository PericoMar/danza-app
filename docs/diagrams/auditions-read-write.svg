<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.07"/>
  </filter>
  <linearGradient id="chrome" x1="0.12" y1="0" x2="0.88" y2="1">
    <stop offset="0%" stop-color="#fdfdfe"/><stop offset="30%" stop-color="#eceef1"/>
    <stop offset="58%" stop-color="#d8dbe1"/><stop offset="80%" stop-color="#eef0f3"/>
    <stop offset="100%" stop-color="#dcdfe5"/>
  </linearGradient>
  <linearGradient id="dark" x1="0.12" y1="0" x2="0.88" y2="1">
    <stop offset="0%" stop-color="#3a3d44"/><stop offset="55%" stop-color="#17191d"/>
    <stop offset="100%" stop-color="#2c2f35"/>
  </linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
  </marker>
  <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7755FF"/>
  </marker>
</defs>
<rect width="1600" height="960" fill="#ffffff"/>
<text x="48" y="56" font-size="10.5" fill="#666666" font-weight="700" text-anchor="start" letter-spacing="2.0">DANZA APP · THE AUDITIONS CONTRACT</text>
<text x="48" y="94" font-size="30" fill="#000000" font-weight="800" text-anchor="start" letter-spacing="-0.9">ONE VIEW TO READ, ONE FUNCTION TO WRITE</text>
<text x="48" y="122" font-size="13" fill="#474747" font-weight="400" text-anchor="start" letter-spacing="0">Screens never assemble an audition and never write one table at a time. Both directions go through a single, documented door.</text>
<rect x="48" y="196" width="724" height="70" rx="10" fill="#ffffff" stroke="#e2e2e4" stroke-width="1" filter="url(#soft)"/>
<rect x="48" y="197" width="5" height="68" rx="2.5" fill="#7755FF"/>
<text x="72" y="226" font-size="9.5" fill="#7755FF" font-weight="800" text-anchor="start" letter-spacing="1.8">READ PATH</text>
<text x="72" y="250" font-size="15" fill="#000000" font-weight="700" text-anchor="start" letter-spacing="0">Any screen showing auditions</text>
<polyline points="82,266 82,292" fill="none" stroke="#666666" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="292" width="724" height="78" rx="10" fill="#ffffff" stroke="#e2e2e4" stroke-width="1" filter="url(#soft)"/>
<circle cx="82" cy="331.0" r="13" fill="#F5F5F7" stroke="#e2e2e4"/>
<text x="82" y="335.0" font-size="11.5" fill="#333333" font-weight="800" text-anchor="middle" letter-spacing="0">1</text>
<text x="110" y="324" font-size="12.5" fill="#000000" font-weight="700" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">app/insights/[companyId].tsx</text>
<text x="110" y="344" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">the company page · a listing card · the home sections</text>
<polyline points="82,370 82,396" fill="none" stroke="#666666" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="396" width="724" height="78" rx="10" fill="#ffffff" stroke="#e2e2e4" stroke-width="1" filter="url(#soft)"/>
<circle cx="82" cy="435.0" r="13" fill="#F5F5F7" stroke="#e2e2e4"/>
<text x="82" y="439.0" font-size="11.5" fill="#333333" font-weight="800" text-anchor="middle" letter-spacing="0">2</text>
<text x="110" y="428" font-size="12.5" fill="#000000" font-weight="700" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">hooks/useCompanyAuditions.tsx</text>
<text x="110" y="448" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">TanStack React Query · one cache key per company</text>
<polyline points="82,474 82,500" fill="none" stroke="#666666" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="500" width="724" height="78" rx="10" fill="#ffffff" stroke="#e2e2e4" stroke-width="1" filter="url(#soft)"/>
<circle cx="82" cy="539.0" r="13" fill="#F5F5F7" stroke="#e2e2e4"/>
<text x="82" y="543.0" font-size="11.5" fill="#333333" font-weight="800" text-anchor="middle" letter-spacing="0">3</text>
<text x="110" y="532" font-size="12.5" fill="#000000" font-weight="700" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">services/auditions.ts</text>
<text x="110" y="552" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">fetchAuditionsByCompany() — the only place that knows the view</text>
<polyline points="82,578 82,604" fill="none" stroke="#666666" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="604" width="724" height="78" rx="10" fill="#111111" stroke="#111111" stroke-width="1"/>
<circle cx="82" cy="643.0" r="13" fill="#2a2d33" stroke="#3a3d44"/>
<text x="82" y="647.0" font-size="11.5" fill="#ffffff" font-weight="800" text-anchor="middle" letter-spacing="0">4</text>
<text x="110" y="636" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">select * from auditions_enriched</text>
<text x="110" y="656" font-size="10.5" fill="#b9bbc2" font-weight="500" text-anchor="start" letter-spacing="0">a Postgres view · security_invoker, so RLS still applies</text>
<polyline points="82,682 82,708" fill="none" stroke="#666666" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="48" y="708" width="724" height="212" rx="10" fill="#FAFAFB" stroke="#e2e2e4" stroke-width="1" filter="url(#soft)"/>
<text x="72" y="736" font-size="9.5" fill="#666666" font-weight="800" text-anchor="start" letter-spacing="1.6">ONE ROW PER AUDITION, ALREADY ASSEMBLED</text>
<text x="72" y="766" font-size="11" fill="#000000" font-weight="600" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">deadlines[] → dates[]</text>
<text x="394" y="766" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">the whole schedule tree, ordered, as nested JSON</text>
<text x="72" y="790" font-size="11" fill="#000000" font-weight="600" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">emails[] · application_links[]</text>
<text x="394" y="790" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">in the order the admin set</text>
<text x="72" y="814" font-size="11" fill="#000000" font-weight="600" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">height_requirements[] · min_age · max_age</text>
<text x="394" y="814" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">who the audition is for</text>
<text x="72" y="838" font-size="11" fill="#000000" font-weight="600" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">status</text>
<text x="394" y="838" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">open_call | post_deadline | past — from current_date</text>
<text x="72" y="862" font-size="11" fill="#000000" font-weight="600" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">next_deadline_date · last_audition_end_date</text>
<text x="394" y="862" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">ready to sort and filter</text>
<polyline points="72,884 748,884" fill="none" stroke="#e2e2e4" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="72" y="906" font-size="11" fill="#333333" font-weight="600" text-anchor="start" letter-spacing="0">One round trip. No client-side joins, no N+1, no status computed twice.</text>
<rect x="828" y="196" width="724" height="70" rx="10" fill="#ffffff" stroke="#e2e2e4" stroke-width="1" filter="url(#soft)"/>
<rect x="828" y="197" width="5" height="68" rx="2.5" fill="#E0447B"/>
<text x="852" y="226" font-size="9.5" fill="#E0447B" font-weight="800" text-anchor="start" letter-spacing="1.8">WRITE PATH</text>
<text x="852" y="250" font-size="15" fill="#000000" font-weight="700" text-anchor="start" letter-spacing="0">Admins only</text>
<polyline points="862,266 862,292" fill="none" stroke="#666666" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="828" y="292" width="724" height="78" rx="10" fill="#ffffff" stroke="#e2e2e4" stroke-width="1" filter="url(#soft)"/>
<circle cx="862" cy="331.0" r="13" fill="#F5F5F7" stroke="#e2e2e4"/>
<text x="862" y="335.0" font-size="11.5" fill="#333333" font-weight="800" text-anchor="middle" letter-spacing="0">1</text>
<text x="890" y="324" font-size="12.5" fill="#000000" font-weight="700" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">app/companies/[id]/auditions/[id]/edit.tsx</text>
<text x="890" y="344" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">AuditionForm · schedule, links, emails, heights, age</text>
<polyline points="862,370 862,396" fill="none" stroke="#666666" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="828" y="396" width="724" height="78" rx="10" fill="#ffffff" stroke="#e2e2e4" stroke-width="1" filter="url(#soft)"/>
<circle cx="862" cy="435.0" r="13" fill="#F5F5F7" stroke="#e2e2e4"/>
<text x="862" y="439.0" font-size="11.5" fill="#333333" font-weight="800" text-anchor="middle" letter-spacing="0">2</text>
<text x="890" y="428" font-size="12.5" fill="#000000" font-weight="700" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">hooks/useAuditionForm.ts</text>
<text x="890" y="448" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">Formik + Yup — the same rules the CHECK constraints enforce</text>
<polyline points="862,474 862,500" fill="none" stroke="#666666" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="828" y="500" width="724" height="78" rx="10" fill="#ffffff" stroke="#e2e2e4" stroke-width="1" filter="url(#soft)"/>
<circle cx="862" cy="539.0" r="13" fill="#F5F5F7" stroke="#e2e2e4"/>
<text x="862" y="543.0" font-size="11.5" fill="#333333" font-weight="800" text-anchor="middle" letter-spacing="0">3</text>
<text x="890" y="532" font-size="12.5" fill="#000000" font-weight="700" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">services/auditions.ts</text>
<text x="890" y="552" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">saveAudition(payload) — builds one jsonb document</text>
<polyline points="862,578 862,604" fill="none" stroke="#666666" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="828" y="604" width="724" height="78" rx="10" fill="#111111" stroke="#111111" stroke-width="1"/>
<circle cx="862" cy="643.0" r="13" fill="#2a2d33" stroke="#3a3d44"/>
<text x="862" y="647.0" font-size="11.5" fill="#ffffff" font-weight="800" text-anchor="middle" letter-spacing="0">4</text>
<text x="890" y="636" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">rpc('save_audition', p jsonb)</text>
<text x="890" y="656" font-size="10.5" fill="#b9bbc2" font-weight="500" text-anchor="start" letter-spacing="0">plpgsql · security invoker · raises unless is_admin()</text>
<polyline points="862,682 862,708" fill="none" stroke="#666666" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="828" y="708" width="724" height="212" rx="10" fill="#FDF1F5" stroke="#F4D3E0" stroke-width="1" filter="url(#soft)"/>
<text x="852" y="736" font-size="9.5" fill="#E0447B" font-weight="800" text-anchor="start" letter-spacing="1.6">ONE TRANSACTION, SEVEN TABLES</text>
<text x="852" y="766" font-size="11" fill="#000000" font-weight="600" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">children matched by id</text>
<text x="1174" y="766" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">kept ids stay stable across a save</text>
<text x="852" y="790" font-size="11" fill="#000000" font-weight="600" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">absent from the payload</text>
<text x="1174" y="790" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">deleted — new ones inserted</text>
<text x="852" y="814" font-size="11" fill="#000000" font-weight="600" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">an omitted key</text>
<text x="1174" y="814" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">left untouched (links, emails, heights)</text>
<text x="852" y="838" font-size="11" fill="#000000" font-weight="600" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">≥ 1 deadline · ≥ 1 date per deadline</text>
<text x="1174" y="838" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">enforced here, with a clear error</text>
<text x="852" y="862" font-size="11" fill="#000000" font-weight="600" text-anchor="start" letter-spacing="0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace">blank strings → NULL</text>
<text x="1174" y="862" font-size="10.5" fill="#929294" font-weight="500" text-anchor="start" letter-spacing="0">array order becomes `position`</text>
<polyline points="852,884 1528,884" fill="none" stroke="#F4D3E0" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="852" y="906" font-size="11" fill="#333333" font-weight="600" text-anchor="start" letter-spacing="0">An audition is never half-saved, and the app can't invent a shape the schema rejects.</text>
<polyline points="786.0,196 786.0,920" fill="none" stroke="#ececee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
