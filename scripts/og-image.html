<!doctype html>
<!--
  Source for public/og-default.png — the link preview card. Edit this, then run
  `pnpm og:image`. Mirrors the Companies hero: Inter, the headline's silver
  sheen on the emphasised line, white ground.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    /* theme/colors.tsx */
    --text: #000000;
    --grey2: #666666;
    --text-light-dark: #474747;
    --headline: linear-gradient(178deg,#6a6f77 0%,#9ba1a9 22%,#c7ccd3 44%,#5b6068 54%,#8b9098 74%,#4e535b 100%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #ffffff;
    font-family: Inter, sans-serif;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 86px;
    position: relative;
  }
  .eyebrow {
    font-size: 15px; font-weight: 500; letter-spacing: 3.2px;
    text-transform: uppercase; color: var(--grey2); margin-bottom: 26px;
  }
  h1 {
    font-size: 104px; font-weight: 900; line-height: 0.92;
    letter-spacing: -3.4px; text-transform: uppercase; color: var(--text);
  }
  .sheen {
    background: var(--headline);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub {
    margin-top: 34px; font-size: 27px; font-weight: 400; color: var(--text-light-dark);
  }
  .brand {
    position: absolute; right: 86px; bottom: 64px;
    display: flex; align-items: center; gap: 16px;
  }
  .brand img { width: 72px; height: 72px; }
  .brand span { font-size: 31px; font-weight: 900; letter-spacing: 0.5px; color: var(--text); }
  .rule { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: var(--headline); }
</style>
</head>
<body>
  <div class="eyebrow">Free · no fees</div>
  <h1>Where dancers<br><span class="sheen">find work</span></h1>
  <div class="sub">Every dance audition in one place</div>
  <div class="brand">
    <img src="../assets/images/favicon.png" alt="">
    <span>danza app</span>
  </div>
  <div class="rule"></div>
</body>
</html>
